name: Build Quick Short Maker APK
on:
push:
  paths:
  workflow_dispatch:
    - 'Quick_Short_Maker_Android_Source_v3.zip'  
                -'.github/workflows/android.yml'

jobs:
  build: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract source
        run: |
          unzip -q Quick_Short_Maker_Android_Source_v3.zip
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: gradle -p QuickShortMaker assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quick-Short-Maker-APK
          path: QuickShortMaker/app/build/outputs/apk/debug/app-debug.apk
          
